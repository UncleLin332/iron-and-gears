<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron & Gears · 鐵律與齒輪</title>
<style>
:root{--bg:#100804;--card-border:#7a5020;--brass:#b07830;--gold:#e0a020;--text:#f0e0c0;--dim:rgba(240,220,180,0.5);--mana:#4a90d0;--red:#e04040;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
#game{width:100%;max-width:1200px;margin:0 auto;padding:0 16px 8px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── Title ── */
#title-bar{text-align:center;padding:10px 0 6px;border-bottom:1px solid rgba(176,120,48,.3);margin-bottom:6px;}
.game-title{font-size:20px;letter-spacing:3px;color:var(--gold);text-shadow:0 0 14px rgba(220,160,30,.4);}

/* ── Info bars ── */
.info-bar{display:flex;align-items:center;gap:10px;padding:5px 8px;background:rgba(0,0,0,.35);border-radius:6px;margin-bottom:4px;}
.hp-orb{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:bold;}
.hp-icon{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8898,#c01830,#780014);border:2px solid #e03048;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);cursor:pointer;transition:box-shadow .2s;}
.hp-icon.valid-target{box-shadow:0 0 0 3px #ff4040,0 0 14px rgba(255,60,60,.6);animation:pulse .8s ease-in-out infinite alternate;}
.fuel-bar{display:flex;gap:4px;align-items:center;flex:1;}
.fuel-crystal{width:18px;height:18px;border-radius:4px;background:#1a3870;border:1px solid #2a5090;transition:background .2s,box-shadow .2s;}
.fuel-crystal.active{background:radial-gradient(circle at 35% 30%,#90c8ff,#1a68d0,#083890);border-color:#60a0f0;box-shadow:0 0 5px rgba(100,160,255,.5);}
.fuel-label{font-size:13px;color:var(--dim);margin-left:4px;}
.info-extra{font-size:13px;color:rgba(220,180,100,.45);margin-left:auto;}

/* ── Boards ── */
.board-area{flex:1;min-height:140px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 10px 20px;background:rgba(255,200,100,.04);border-radius:8px;border:1px dashed rgba(180,120,40,.18);flex-wrap:wrap;overflow:visible;}
.board-empty{color:var(--dim);font-size:14px;font-style:italic;}

/* ── Minion cards (board) ── */
.minion-card{width:130px;height:178px;background:#1e1006;border:2px solid var(--card-border);border-radius:10px;position:relative;cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:visible;flex-shrink:0;display:flex;flex-direction:column;}
.minion-card:hover{transform:translateY(-4px);}
.minion-card.can-attack{box-shadow:0 0 0 1.5px #60c060,0 0 8px rgba(80,200,80,.3);}
.minion-card.selected-attacker{border-color:#f0a020;box-shadow:0 0 0 2px #f0a020,0 0 14px rgba(240,160,32,.5);}
.minion-card.valid-target{border-color:#e03030;box-shadow:0 0 0 2px #e03030,0 0 10px rgba(220,50,50,.5);animation:pulse .8s ease-in-out infinite alternate;cursor:crosshair;}
.minion-card.exhausted{opacity:.6;filter:grayscale(.35);}
.minion-card.dying{animation:explode .4s ease-out forwards;}
@keyframes explode{0%{transform:scale(1);opacity:1;}60%{transform:scale(1.2);opacity:.8;}100%{transform:scale(0);opacity:0;}}
@keyframes pulse{from{box-shadow:0 0 0 2px #e03030,0 0 6px rgba(220,50,50,.4);}to{box-shadow:0 0 0 3px #ff4040,0 0 16px rgba(255,60,60,.6);}}

.card-portrait-mini{width:100%;height:76px;border-radius:8px 8px 0 0;overflow:hidden;flex-shrink:0;}
.portrait-img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;}
.card-name-mini{font-size:10.5px;font-weight:bold;text-align:center;color:var(--text);padding:3px 4px;line-height:1.2;display:flex;align-items:center;justify-content:center;flex:1;}
.card-text-mini{font-size:9px;color:rgba(240,200,140,.65);text-align:center;padding:0 4px 3px;font-style:italic;line-height:1.2;}
.card-stats{position:absolute;bottom:-10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 4px;}
.stat-gem{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);border:2px solid;}
.gem-atk{background:radial-gradient(circle at 35% 30%,#ffe870,#c88010,#7a4800);border-color:#dda020;}
.gem-hp{background:radial-gradient(circle at 35% 30%,#ff8898,#c01830,#780014);border-color:#e03048;}
.gem-hp.wounded{background:radial-gradient(circle at 35% 30%,#ff3030,#a00808,#600004);}
.taunt-ring{position:absolute;inset:-5px;border:2.5px solid #88bb30;border-radius:15px;pointer-events:none;box-shadow:0 0 10px rgba(140,200,50,.4);}

/* ── Hero target ── */
.hero-btn{display:inline-flex;align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a2c18,#1e0c04);border:2.5px solid var(--card-border);cursor:pointer;font-size:32px;transition:border-color .2s,box-shadow .2s;position:relative;flex-shrink:0;}
.hero-btn .hp-badge{position:absolute;bottom:-3px;right:-3px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8898,#c01830);border:2px solid #e03048;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;}
.hero-btn.valid-target{border-color:#e03030;box-shadow:0 0 12px rgba(220,50,50,.5);animation:pulse .8s ease-in-out infinite alternate;cursor:crosshair;}

/* ── Divider ── */
#divider{text-align:center;padding:3px 0;font-size:14px;color:rgba(180,120,40,.4);letter-spacing:3px;}

/* ── Controls ── */
#player-controls{display:flex;gap:6px;padding:4px 0;align-items:center;flex-wrap:wrap;}
.btn{padding:7px 16px;border:1.5px solid var(--brass);background:rgba(180,120,40,.12);color:var(--text);border-radius:5px;cursor:pointer;font-family:Georgia,serif;font-size:14px;transition:background .15s,border-color .15s;}
.btn:hover:not(:disabled){background:rgba(180,120,40,.28);border-color:var(--gold);}
.btn.primary{border-color:var(--gold);background:rgba(220,160,20,.18);color:#f0e090;}
.btn.danger{border-color:#c04030;background:rgba(180,50,40,.12);color:#f08080;}
.btn.music-on{border-color:#70b060;background:rgba(80,160,80,.18);color:#d8f0c0;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.phase-hint{font-size:13px;color:rgba(220,180,80,.5);font-style:italic;margin-left:auto;}
#music-toggle{position:fixed;top:10px;right:10px;z-index:90;min-width:64px;box-shadow:0 8px 24px rgba(0,0,0,.38);backdrop-filter:blur(6px);}

/* ── Hand ── */
#player-hand{display:flex;gap:8px;padding:12px 4px 20px;justify-content:center;flex-wrap:wrap;min-height:185px;align-items:flex-end;border-top:1px solid rgba(180,120,40,.18);margin-top:6px;overflow:visible;}
.hand-card{width:120px;height:168px;background:#1e1006;border:2px solid var(--card-border);border-radius:10px;position:relative;cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:visible;flex-shrink:0;display:flex;flex-direction:column;}
.hand-card:hover{transform:translateY(-14px) scale(1.06);z-index:10;}
.hand-card.selected-hand{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(220,160,30,.5);transform:translateY(-16px) scale(1.08);z-index:10;}
.hand-card.cant-afford{opacity:.45;filter:grayscale(.4);}
.hand-card .mana-gem{position:absolute;top:-7px;left:-7px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#90c8ff,#1a68d0,#083890);border:2px solid #60a0f0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:5;}
.hand-portrait{width:100%;height:68px;border-radius:8px 8px 0 0;overflow:hidden;flex-shrink:0;}
.hand-name{font-size:10px;font-weight:bold;text-align:center;padding:3px 3px;line-height:1.2;display:flex;align-items:center;justify-content:center;color:var(--text);background:rgba(176,120,48,.12);flex-shrink:0;}
.hand-text{font-size:8.5px;color:rgba(240,210,160,.65);text-align:center;padding:3px 4px;font-style:italic;line-height:1.25;flex:1;}
.hand-stats{position:absolute;bottom:-7px;left:0;right:0;display:flex;justify-content:space-between;padding:0 3px;}
.hand-stats .stat-gem{width:26px;height:26px;font-size:13px;}

/* ── Hover card zoom ── */
#card-preview{position:fixed;top:50%;left:50%;z-index:2000;pointer-events:none;opacity:0;visibility:hidden;transform:translate(-50%,-50%) scale(.94);transition:opacity .14s ease,visibility .14s ease,transform .14s ease;}
#card-preview.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);}
.card-zoom{position:relative;width:360px;height:500px;background:#1e1006;border:5px solid var(--card-border);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.78),0 0 0 2px rgba(224,160,32,.32),0 0 32px rgba(224,160,32,.22);display:flex;flex-direction:column;overflow:visible;}
.card-zoom .zoom-mana{position:absolute;top:-15px;left:-15px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#90c8ff,#1a68d0,#083890);border:4px solid #60a0f0;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.9);z-index:2;}
.card-zoom .zoom-portrait{width:100%;height:235px;border-radius:13px 13px 0 0;overflow:hidden;flex-shrink:0;background:#140904;}
.card-zoom .zoom-portrait svg,.card-zoom .zoom-portrait .portrait-img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;}
.card-zoom .zoom-name{min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 26px;background:rgba(176,120,48,.14);border-top:2px solid rgba(176,120,48,.36);border-bottom:2px solid rgba(176,120,48,.28);color:var(--text);font-size:24px;font-weight:bold;line-height:1.15;}
.card-zoom .zoom-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 24px 28px;color:rgba(240,210,160,.82);font-size:20px;font-style:italic;line-height:1.35;}
.card-zoom .zoom-stats{position:absolute;bottom:-16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;}
.card-zoom .zoom-stats .stat-gem{width:64px;height:64px;font-size:29px;border-width:4px;}
@media (max-width:480px),(max-height:640px){
  .card-zoom{width:min(76vw,320px);height:min(82vh,444px);}
  .card-zoom .zoom-portrait{height:47%;}
  .card-zoom .zoom-name{font-size:20px;min-height:54px;}
  .card-zoom .zoom-text{font-size:17px;padding:12px 20px 24px;}
}

/* ── Log ── */
#game-log{border-top:1px solid rgba(180,120,40,.18);margin-top:6px;padding:6px 10px;max-height:110px;overflow-y:auto;background:rgba(0,0,0,.2);border-radius:0 0 6px 6px;font-size:13px;}
#game-log::-webkit-scrollbar{width:4px;}
#game-log::-webkit-scrollbar-track{background:rgba(0,0,0,.2);}
#game-log::-webkit-scrollbar-thumb{background:rgba(176,120,48,.4);border-radius:2px;}
.log-entry{padding:1px 0;border-bottom:1px solid rgba(180,120,40,.07);line-height:1.4;}
.log-player{color:#c0d890;}.log-ai{color:#d090c0;}.log-sys{color:rgba(220,190,140,.45);font-style:italic;}.log-dmg{color:#e08080;}.log-death{color:#a06080;}

/* ── Turn banner ── */
#turn-banner{text-align:center;font-size:13px;color:rgba(200,160,80,.5);letter-spacing:1px;padding:3px 0;}
#ai-thinking{display:none;text-align:center;color:rgba(200,140,200,.6);font-size:13px;font-style:italic;padding:3px;animation:blink 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ── Damage float ── */
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}70%{opacity:.9;}100%{opacity:0;transform:translateY(-44px) scale(1.35);}}
.dmg-float{position:fixed;font-size:22px;font-weight:900;color:#ff4040;text-shadow:0 0 8px rgba(255,60,60,.7),0 1px 3px rgba(0,0,0,.9);pointer-events:none;z-index:1000;animation:floatUp .9s ease-out forwards;}

/* ── Attack Animation ── */
@keyframes impactShake{0%{transform:translate(0,0) rotate(0);}18%{transform:translate(-6px,-2px) rotate(-1.5deg);}36%{transform:translate(6px,2px) rotate(1.5deg);}54%{transform:translate(-4px,0) rotate(-.8deg);}72%{transform:translate(4px,0) rotate(.8deg);}100%{transform:translate(0,0) rotate(0);}}
@keyframes impactRing{0%{opacity:.9;transform:scale(.8);}100%{opacity:0;transform:scale(2.4);}}
.impact-shake{animation:impactShake .3s ease-out forwards !important;transform-origin:center center;}
.impact-ring{position:fixed;width:56px;height:56px;border-radius:50%;border:3px solid #ff6030;pointer-events:none;z-index:800;transform:scale(.8);animation:impactRing .35s ease-out forwards;}
.atk-clone{position:fixed;pointer-events:none;z-index:850;border-radius:8px;overflow:hidden;border:2px solid #f0d040;box-shadow:0 0 0 2px #f0a020,0 0 20px rgba(240,180,32,.9),0 4px 16px rgba(0,0,0,.6);}

/* ── Game over ── */
#game-over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#game-over.show{display:flex;}
.go-title{font-size:30px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 20px rgba(220,160,30,.6);}
.go-sub{font-size:13px;color:var(--dim);text-align:center;max-width:280px;line-height:1.5;}

/* ── AI hand visual indicator ── */
.ai-hand-card{display:inline-block;width:30px;height:42px;background:#1a1008;border:1.5px solid #4a3010;border-radius:4px;margin:0 2px;vertical-align:middle;}

/* ── Combo Story Dialog ── */
#combo-dialog{position:fixed;inset:0;z-index:450;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;background:rgba(0,0,0,0);
  transition:opacity .38s ease,background .38s ease;}
#combo-dialog.show{opacity:1;pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.72);}
.combo-inner{width:min(700px,92vw);text-align:center;cursor:default;
  background:linear-gradient(160deg,#0d0802 0%,#1e1006 100%);border:2px solid var(--gold);
  border-radius:18px;padding:32px 40px 22px;
  box-shadow:0 0 80px rgba(220,160,30,.5),0 0 160px rgba(220,160,30,.22),inset 0 0 50px rgba(220,160,30,.08);}
.combo-activated-lbl{font-size:11px;letter-spacing:6px;color:rgba(220,160,60,.6);margin-bottom:12px;}
.combo-divider{width:75%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:10px auto;opacity:.5;}
.combo-name-txt{font-size:26px;font-weight:bold;letter-spacing:2px;line-height:1.3;margin:8px 0 12px;}
.combo-flavor-txt{font-size:14px;color:rgba(240,210,160,.75);line-height:1.9;font-style:italic;margin-bottom:12px;}
.combo-quote-txt{font-size:16px;font-weight:bold;color:var(--text);margin-bottom:14px;
  padding:10px 18px;background:rgba(255,255,255,.05);border-radius:8px;border-left:3px solid var(--gold);}
.combo-effect-txt{font-size:13px;background:rgba(0,0,0,.35);border-radius:8px;padding:12px 18px;
  color:rgba(240,220,180,.9);line-height:1.7;margin-bottom:10px;}
.combo-dismiss-txt{font-size:12px;color:rgba(200,160,80,.5);letter-spacing:1px;}

/* ── Tribe badge ── */
.tribe-badge{position:absolute;top:-6px;right:-6px;background:#5a3080;border:1px solid #9060c0;border-radius:8px;font-size:7px;color:#d0a0ff;padding:1px 4px;z-index:5;white-space:nowrap;}

/* ── Graveyard btn ── */
.graveyard-btn{display:inline-flex;align-items:center;gap:3px;background:rgba(50,15,70,.4);border:1px solid rgba(130,70,170,.3);color:rgba(180,130,210,.6);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:Georgia,serif;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;}
.graveyard-btn:hover{background:rgba(75,25,95,.55);border-color:rgba(170,100,210,.5);color:rgba(210,165,240,.9);}
.graveyard-btn.has-cards{border-color:rgba(155,95,200,.55);color:rgba(205,155,235,.85);}
.hand-count{font-size:11px;border-radius:4px;padding:1px 5px;background:rgba(0,0,0,.22);color:rgba(195,175,115,.55);}
.hand-count.near-full{color:rgba(225,145,45,.8);}
.hand-count.full{color:rgba(215,55,55,.85);}

/* ── Graveyard modal ── */
#graveyard-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:600;align-items:center;justify-content:center;}
#graveyard-modal.show{display:flex;}
.grave-inner{background:linear-gradient(160deg,#0d0802 0%,#1c0c12 100%);border:2px solid rgba(135,75,175,.45);border-radius:14px;padding:18px 20px 14px;width:min(640px,94vw);max-height:84vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 60px rgba(110,55,150,.28);}
.grave-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(135,75,175,.2);padding-bottom:10px;}
.grave-title-txt{font-size:13px;color:rgba(195,155,228,.88);letter-spacing:3px;}
.grave-close-btn{background:none;border:1px solid rgba(200,95,95,.35);color:rgba(220,115,115,.75);border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;}
.grave-close-btn:hover{background:rgba(175,45,45,.25);}
#grave-card-list{overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px;justify-content:flex-start;max-height:63vh;}
#grave-card-list::-webkit-scrollbar{width:4px;}
#grave-card-list::-webkit-scrollbar-thumb{background:rgba(135,75,175,.38);border-radius:2px;}
.grave-card{width:78px;text-align:center;background:rgba(18,6,6,.88);border:1px solid rgba(95,55,115,.4);border-radius:9px;padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.grave-card.burned{border-color:rgba(155,65,25,.45);filter:sepia(.45) brightness(.85);}
.grave-portrait{width:56px;height:44px;border-radius:5px;overflow:hidden;flex-shrink:0;}
.grave-portrait img,.grave-portrait svg{width:100%;height:100%;object-fit:cover;display:block;}
.grave-card-name{font-size:7px;color:rgba(238,198,158,.78);line-height:1.35;word-break:break-all;}
.grave-card-stats{font-size:8px;color:rgba(195,145,95,.62);}
.grave-card-reason{font-size:7px;color:rgba(178,115,115,.55);font-style:italic;}
.grave-empty-txt{color:rgba(195,155,95,.28);font-style:italic;font-size:12px;text-align:center;padding:28px 0;width:100%;}

/* ── Fly-to-graveyard animation ── */
@keyframes flyCardSpin{0%{opacity:.85;transform:scale(1) rotate(0deg);}100%{opacity:0;transform:scale(.12) rotate(25deg);}}
.fly-to-grave{position:fixed;z-index:1500;pointer-events:none;background:#2a1008;border:2px solid #7a5020;border-radius:8px;}

/* ── Mulligan overlay ── */
#mulligan-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#mulligan-overlay.show{display:flex;}
.mulligan-title{font-size:20px;letter-spacing:3px;color:var(--gold);text-shadow:0 0 16px rgba(220,160,30,.5);}
.mulligan-sub{font-size:12px;color:var(--dim);text-align:center;max-width:360px;line-height:1.6;}
#mulligan-hand{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:8px;}
.mulligan-card-wrap{position:relative;cursor:pointer;border-radius:9px;transition:transform .15s;}
.mulligan-card-wrap:hover{transform:translateY(-6px);}
.mulligan-card-wrap.selected .hand-card{border-color:#e03030;box-shadow:0 0 0 2px #e03030,0 0 14px rgba(220,50,50,.5);opacity:.65;}
.mulligan-card-wrap.selected::after{content:'✕ 更換';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:bold;color:#ff7070;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:4px;pointer-events:none;z-index:2;}
</style>
</head>
<body>
<button id="music-toggle" class="btn" onclick="toggleMusic()" title="切換背景音樂">音樂關</button>
<div id="game">
  <div id="title-bar">
    <div class="game-title">⚙ 鐵律與齒輪 · Iron &amp; Gears ⚙</div>
  </div>

let UID = 0;
function makeCard(t) {
  return { id:UID++, name:t.name, cost:t.cost, atk:t.atk, hp:t.hp, maxHp:t.hp,
    text:t.text, portrait:t.portrait, tribe:t.tribe||'',
    taunt:!!t.taunt, deathrattle:!!t.deathrattle, battlecry:!!t.battlecry, endOfTurn:!!t.endOfTurn,
    bcType:t.bcType||'', drType:t.drType||'', eotType:t.eotType||'',
    hasAttacked:false, isSick:true };
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){return shuffle(Array.from({length:30},()=>makeCard(TEMPLATES[Math.floor(Math.random()*TEMPLATES.length)])));}

let G = {};

// ═══════════════════════════════════════
//  MUSIC CONTROLS
// ═══════════════════════════════════════
// music/music.js supplies the audio engine; music/music2.js supplies this version's arrangement.
async function startMusic() {
  initAudio();
  if(!Music.ctx) return;
  if(Music.ctx.state === "suspended") await Music.ctx.resume();
  Music.enabled = true;
  Music.started = true;
  Music.master.gain.cancelScheduledValues(Music.ctx.currentTime);
  Music.master.gain.setTargetAtTime(0.16, Music.ctx.currentTime, 0.04);
  Music.step = Music.step || 0;
  Music.nextTime = Music.ctx.currentTime + 0.05;
  clearInterval(Music.timer);
  Music.timer = setInterval(musicScheduler, Music.lookahead);
  musicScheduler();
  render();
}

function stopMusic() {
  Music.enabled = false;
  clearInterval(Music.timer);
  Music.timer = null;
  if(Music.master) {
    const now = Music.ctx.currentTime;
    Music.master.gain.cancelScheduledValues(now);
    Music.master.gain.setTargetAtTime(0.0001, now, 0.05);
    setTimeout(()=>{
      if(Music.master && !Music.enabled) Music.master.gain.value = 0.16;
    }, 180);
  }
  render();
}

function toggleMusic() {
  if(Music.enabled) stopMusic();
  else startMusic();
}

function renderMusicToggle() {
  const btn = document.getElementById("music-toggle");
  if(!btn) return;
  btn.textContent = Music.enabled ? "音樂開" : "音樂關";
  btn.className = `btn${Music.enabled ? " music-on" : ""}`;
}
function initGame() {
  G = {
    turn:1, phase:'player', savedFuel:0, aiSavedFuel:0, gameOver:false,
    player:{ hp:30, fuel:0, maxFuel:0, deck:[], hand:[], board:[], fatigue:0, graveyard:[] },
    ai:    { hp:30, fuel:0, maxFuel:0, deck:[], hand:[], board:[], fatigue:0, graveyard:[] },
    selHand:-1, selBoard:-1, log:[], aiThinking:false,
    activatedCombos: new Set(),
    pendingRevival: [],
  };
  G.player.deck = makeDeck();
  G.ai.deck     = makeDeck();
  for(let i=0;i<3;i++){ drawCard(G.player,false); drawCard(G.ai,false); }
  log("⚙️  歡迎來到《鐵律與齒輪》！先手玩家：林工程師","sys");
  log("✋ 換牌階段開始，請選擇要更換的手牌","sys");
  G.phase = 'mulligan';
  G.mulliganSelected = new Set();
  showMulliganOverlay();
  render();
}

function drawCard(who, show=true) {
  if(who.deck.length===0){
    who.fatigue++;
    who.hp -= who.fatigue;
    if(show) log(`💀 ${who===G.player?'你':'AI'} 無牌可抽！疲勞 ${who.fatigue} 傷害！`,"dmg");
    return;
  }
  const c = who.deck.shift();
  if(who.hand.length>=10){
    if(show) log(`🔥 ${who===G.player?'你':'AI'} 手牌滿！${c.name} 被燒毀！`,"sys");
    who.graveyard.push({...c, reason:'burned'});
    if(who===G.player){
      const deckEl=document.getElementById('player-deck-lbl');
      if(deckEl) animateFlyToGrave(deckEl.getBoundingClientRect(),'player-grave-btn');
    }
    return;
  }
  who.hand.push(c);
  if(show && who===G.player) log(`📥 抽到了 ${c.name}`,"player");
}

// ═══════════════════════════════════════
function showMulliganOverlay() {
  const overlay = document.getElementById('mulligan-overlay');
  const handEl  = document.getElementById('mulligan-hand');
  overlay.setAttribute('aria-hidden','false');
  overlay.classList.add('show');
  renderMulliganHand(handEl);
}

function renderMulliganHand(container) {
  container.innerHTML = G.player.hand.map(c => {
    const sel = G.mulliganSelected.has(c.id);
    return `<div class="mulligan-card-wrap${sel?' selected':''}" onclick="toggleMulligan(${c.id})" onmouseenter="showMulliganCardPreview(${c.id})" onmouseleave="hideCardPreview()">
      <div class="hand-card" style="pointer-events:none;">
        <div class="mana-gem">${c.cost}</div>
        <div class="hand-portrait">${portraitArt(c,48)}</div>
        <div class="hand-name">${c.name}</div>
        <div class="hand-text">${c.text||'&nbsp;'}</div>
        <div class="hand-stats">
          <div class="stat-gem gem-atk">${c.atk}</div>
          <div class="stat-gem gem-hp">${c.hp}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  const countEl = document.getElementById('mulligan-count');
  if(countEl) countEl.textContent = `已選 ${G.mulliganSelected.size} / 3`;
}

function toggleMulligan(cardId) {
  if(G.mulliganSelected.has(cardId)){
    G.mulliganSelected.delete(cardId);
  } else if(G.mulliganSelected.size < 3){
    G.mulliganSelected.add(cardId);
  }
  renderMulliganHand(document.getElementById('mulligan-hand'));
}

function confirmMulligan() {
  // 玩家換牌
  const toSwap = G.player.hand.filter(c => G.mulliganSelected.has(c.id));
  G.player.hand = G.player.hand.filter(c => !G.mulliganSelected.has(c.id));
  for(const c of toSwap){
    const tmpl = TEMPLATES.find(t => t.name === c.name);
    const pos  = Math.floor(Math.random() * (G.player.deck.length + 1));
    G.player.deck.splice(pos, 0, makeCard(tmpl || c));
  }
  for(let i=0; i<toSwap.length; i++) drawCard(G.player, false);

  // AI 簡單換牌策略（換掉手中費用最高的牌，最多換2張）
  const aiSwap = G.ai.hand
    .filter(c => c.cost >= 7)
    .slice(0, 2);
  G.ai.hand = G.ai.hand.filter(c => !aiSwap.includes(c));
  for(const c of aiSwap){
    const tmpl = TEMPLATES.find(t => t.name === c.name);
    const pos  = Math.floor(Math.random() * (G.ai.deck.length + 1));
    G.ai.deck.splice(pos, 0, makeCard(tmpl || c));
    drawCard(G.ai, false);
  }

  // 關閉換牌層
  const overlay = document.getElementById('mulligan-overlay');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden','true');
  G.mulliganSelected = new Set();

  if(toSwap.length > 0)
    log(`🔄 你換掉了 ${toSwap.length} 張牌`, "sys");
  log("　選取手牌後按【部署】；點選己方手下再點對手/英雄發動攻擊","sys");
  startPlayerTurn();
}

// ═══════════════════════════════════════
//  TRIBE SYNERGY
// ═══════════════════════════════════════
function checkTribeSynergy(c, owner) {
  if(!c.tribe) return;
  const allies = owner.board.filter(x => x.tribe === c.tribe && x.id !== c.id);
  if(allies.length >= 1){
    drawCard(owner, true);
    const tag = owner === G.player ? "player" : "ai";
    log(`✨ 族群共鳴【${c.tribe}族】：${c.name} 與同伴齊聚，抽了一張牌！`, tag);
  }
}

function showComboDialog(id, onDone) {
  const d = COMBO_DATA[id];
  if(!d){ if(onDone) onDone(); return; }
  const el = document.getElementById('combo-dialog');
  document.getElementById('combo-name-txt').textContent   = d.name;
  document.getElementById('combo-name-txt').style.color   = d.color;
  document.getElementById('combo-flavor-txt').textContent = d.flavor;
  document.getElementById('combo-quote-txt').textContent  = d.quote;
  document.getElementById('combo-effect-txt').innerHTML   = d.effect.replace(/\n/g,'<br>');
  const inner = el.querySelector('.combo-inner');
  inner.style.borderColor = d.color;
  inner.style.boxShadow   = `0 0 80px ${d.color}88,0 0 160px ${d.color}33,inset 0 0 50px ${d.color}11`;
  el.querySelector('.combo-quote-txt').style.borderLeftColor = d.color;
  el.setAttribute('aria-hidden','false');
  el.classList.add('show');
  const close = () => {
    el.classList.remove('show');
    el.setAttribute('aria-hidden','true');
    el.removeEventListener('click', close);
    setTimeout(()=>{ if(onDone) onDone(); }, 400);
  };
  el.addEventListener('click', close);
}

function checkCombos(who) {
  const board   = who.board;
  const enemy   = (who===G.player) ? G.ai : G.player;
  const tag     = (who===G.player) ? "player" : "ai";

  // ── Combo 1: 命運宿敵 — 大頭森 vs 文班亞馬 (opposite sides) ──
  const myBigHead  = board.some(c=>c.name==='紐約隊長·大頭森');
  const foeWemby   = enemy.board.some(c=>c.name==='少林奇才·文班亞馬');
  const myWemby    = board.some(c=>c.name==='少林奇才·文班亞馬');
  const foeBigHead = enemy.board.some(c=>c.name==='紐約隊長·大頭森');
  if((myBigHead&&foeWemby)||(myWemby&&foeBigHead)){
    if(!G.activatedCombos.has('destiny_rivals')){
      G.activatedCombos.add('destiny_rivals');
      showComboDialog('destiny_rivals');
      log('⚔️ Combo激活：【總決賽·命運宿敵】','sys');
    }
  }

  // ── Combo 2: 發條孿生星 — 卡斯托爾 + 波魯克斯 同場 ──
  if(board.some(c=>c.name==='發條先知·卡斯托爾') && board.some(c=>c.name==='發條先知·波魯克斯')){
    if(!G.activatedCombos.has('twin_stars')){
      G.activatedCombos.add('twin_stars');
      showComboDialog('twin_stars');
      log('✨ Combo激活：【發條孿生星的黃昏交響曲】',tag);
    }
  }

  // ── Combo 3: 林大師忠犬 — 林大師 + 機械寵物 同場 ──
  const lin = board.find(c=>c.name==='龍紋機關師·林大師');
  const pet = board.find(c=>c.name==='林大師的機械寵物');
  if(lin && pet){
    if(!G.activatedCombos.has('master_lin')){
      G.activatedCombos.add('master_lin');
      showComboDialog('master_lin');
      log('🐾 Combo激活：【林大師與他的忠犬晶片】',tag);
    }
    if(!pet.taunt){ pet.taunt=true; }           // 持續效果：機械寵物獲得攔截
  } else if(pet && !lin){
    pet.taunt = !!(COMBO_DATA && pet._origTaunt); // 林大師不在場時移除 combo 賦予的攔截
  }

  // ── Combo 4: 天穹補給陣線 — 2+ 天穹族同場 ──
  if(board.filter(c=>c.tribe==='天穹').length >= 2){
    if(!G.activatedCombos.has('sky_defense')){
      G.activatedCombos.add('sky_defense');
      showComboDialog('sky_defense');
      log('📡 Combo激活：【天穹學院的空中補給陣線】',tag);
    }
  }
}

// ═══════════════════════════════════════
//  TURN FLOW
// ═══════════════════════════════════════
function startPlayerTurn() {
  G.phase='player'; G.selHand=-1; G.selBoard=-1;
  const extra=G.savedFuel; G.savedFuel=0;
  G.player.maxFuel = Math.min(G.turn,10);
  G.player.fuel    = G.player.maxFuel + extra;
  for(const c of G.player.board){ c.hasAttacked=false; c.isSick=false; }
  drawCard(G.player);
  const playerRevivals = G.pendingRevival.filter(r=>r.side==='player');
  G.pendingRevival = G.pendingRevival.filter(r=>r.side!=='player');
  for(const r of playerRevivals){
    if(G.player.board.length<7){
      const star=makeCard({name:"發條幼星",cost:0,atk:1,hp:1,text:"（重組殘骸）",portrait:"gear",tribe:"發條"});
      star.isSick=true; G.player.board.push(star);
      log(`✨ 發條幼星 從殘骸中重組歸來！`,"player");
    }
  }
  log(`─── 第 ${G.turn} 回合 ─── 你的燃料: ${G.player.fuel}/${G.player.maxFuel}`,"sys");
  render();
}

function endPlayerTurn() {
  if(G.phase!=='player'||G.gameOver) return;
  G.selHand=-1; G.selBoard=-1;
  handleEndOfTurnEffects(G.player);
  log("─── 結束回合，輪到AI ───","sys");
  G.phase='ai'; render();
  setTimeout(doAiTurn,700);
}

// ═══════════════════════════════════════
//  AI TURN
// ═══════════════════════════════════════
function doAiTurn() {
  const aiExtra=G.aiSavedFuel; G.aiSavedFuel=0;
  G.ai.maxFuel = Math.min(G.turn,10);
  G.ai.fuel    = G.ai.maxFuel + aiExtra;
  for(const c of G.ai.board){ c.hasAttacked=false; c.isSick=false; }
  drawCard(G.ai,false);
  const aiRevivals = G.pendingRevival.filter(r=>r.side==='ai');
  G.pendingRevival = G.pendingRevival.filter(r=>r.side!=='ai');
  for(const r of aiRevivals){
    if(G.ai.board.length<7){
      const star=makeCard({name:"發條幼星",cost:0,atk:1,hp:1,text:"（重組殘骸）",portrait:"gear",tribe:"發條"});
      star.isSick=true; G.ai.board.push(star);
      log(`✨ AI 的發條幼星 從殘骸中重組歸來！`,"ai");
    }
  }
  log(`─── AI 回合 ─── 燃料: ${G.ai.fuel}/${G.ai.maxFuel}`,"ai");
  G.aiThinking=true; render();
  aiPlay(()=>{
    G.aiThinking=false;
    setTimeout(()=>{
      aiAttackAll(()=>{
        handleEndOfTurnEffects(G.ai);
        G.turn++; if(checkWin())return; startPlayerTurn();
      });
    },500);
  });
}

function aiPlay(cb,tries=0) {
  if(tries>20){cb();return;}
  const affordable = G.ai.hand
    .map((c,i)=>({c,i}))
    .filter(({c})=>c.cost<=G.ai.fuel)
    .sort((a,b)=>(b.c.taunt?1:0)-(a.c.taunt?1:0)||(b.c.cost-a.c.cost));
  if(!affordable.length||G.ai.board.length>=7){cb();return;}
  const {c,i}=affordable[0];
  G.ai.fuel-=c.cost; G.ai.hand.splice(i,1);
  c.isSick=true; c.hasAttacked=false;
  G.ai.board.push(c);
  log(`⚙ AI 部署了 ${c.name}`,"ai");
  if(c.battlecry){ doBattlecry(c, G.player, G.ai); }
  checkTribeSynergy(c, G.ai);
  checkCombos(G.player); checkCombos(G.ai);
  render(); if(checkWin())return;
  setTimeout(()=>aiPlay(cb,tries+1),600);
}

function aiAttackAll(cb) {
  const a = G.ai.board.find(c=>canAttack(c));
  if(!a){cb();return;}
  const taunts=G.player.board.filter(c=>c.taunt);
  const pool  =taunts.length?taunts:G.player.board;
  let target=null,face=false;
  if(!pool.length){ face=true; }
  else {
    const killNoLoss=pool.filter(t=>t.hp<=a.atk&&t.atk<a.hp);
    const kill      =pool.filter(t=>t.hp<=a.atk);
    if(killNoLoss.length) target=killNoLoss.reduce((m,t)=>t.atk>m.atk?t:m,killNoLoss[0]);
    else if(kill.length)  target=kill[0];
    else target=pool[Math.floor(Math.random()*pool.length)];
  }

  // 找到 DOM 元素
  const tgtEl = face
    ? document.getElementById('player-hero-hp')
    : document.querySelector(`#player-board [data-card-id="${target.id}"]`);

  const atkId    = a.id;
  const targetId = target ? target.id : null;

  animateAttack(atkId, tgtEl, () => {
    // 動畫結束後執行實際戰鬥
    const a2 = G.ai.board.find(c=>c.id===atkId);
    if(face){
      if(a2){ G.player.hp-=a2.atk; a2.hasAttacked=true; log(`💢 AI的 ${a2.name} 直接攻擊你！-${a2.atk}`,"dmg"); showFloat(a2.atk,'player-hero-hp'); }
    } else {
      const def2 = G.player.board.find(c=>c.id===targetId);
      if(a2 && def2) combat(a2,G.ai,def2,G.player);
    }
    render(); if(checkWin())return;
    setTimeout(()=>aiAttackAll(cb), 300);
  });
}

function combat(atk,atkOwner,def,defOwner) {
  // Combo 1：命運宿敵 — 大頭森攻擊文班亞馬時 ATK +2（永久）
  let combo1Bonus = 0;
  if(atk.name==='紐約隊長·大頭森' && def.name==='少林奇才·文班亞馬' && G.activatedCombos.has('destiny_rivals')){
    combo1Bonus = 2; atk.atk += 2;
    log(`🏀 小巨人挑戰！大頭森無視護甲，攻擊力永久 +2，向文班亞馬發起衝擊！`,"player");
  }
  log(`⚡ ${atk.name}(${atk.atk}/${atk.hp}) 攻擊 ${def.name}(${def.atk}/${def.hp})`,"dmg");
  atk.hp-=def.atk; def.hp-=atk.atk; atk.hasAttacked=true;
  if(atk.hp<=0){ log(`💀 ${atk.name} 報廢了！`,"death"); killCard(atk,atkOwner,defOwner); }
  if(def.hp<=0){ log(`💀 ${def.name} 報廢了！`,"death"); killCard(def,defOwner,atkOwner); }
}

// owner = side that owns the dying card; enemy = opposing side
function killCard(c, owner, enemy) {
  // Fly-to-graveyard animation — must capture DOM rect before board is mutated
  const _dEl = document.querySelector(`.minion-card[data-card-id="${c.id}"]`);
  if(_dEl) animateFlyToGrave(_dEl.getBoundingClientRect(), owner===G.player?'player-grave-btn':'ai-grave-btn');
  owner.board = owner.board.filter(x=>x.id!==c.id);
  owner.graveyard.push({...c, reason:'died'});
  // Combo 2: 發條孿生星 — 雙星之一死亡時，若另一雙星在場，下回合復活為1/1發條幼星
  const TWINS = ['發條先知·卡斯托爾','發條先知·波魯克斯'];
  if(TWINS.includes(c.name) && G.activatedCombos.has('twin_stars')){
    const otherTwin = TWINS.find(n=>n!==c.name);
    if(owner.board.some(x=>x.name===otherTwin)){
      const side = owner===G.player ? 'player' : 'ai';
      G.pendingRevival.push({side});
      log(`✨ ${c.name} 的殘骸化為星塵，等待下回合重組！`, side);
    }
  }
  if(!c.deathrattle) return;
  const tag = owner===G.player?"player":"ai";
  switch(c.drType) {
    case 'summon11':
      if(owner.board.length<7){
        const trap=makeCard({name:"機關陷阱",cost:0,atk:1,hp:1,text:"",portrait:"gear"});
        trap.isSick=true; owner.board.push(trap);
        // Combo 3: 林大師忠犬 — 機械寵物報廢時，林大師強化陷阱並回復生命
        if(c.name==='林大師的機械寵物' && owner.board.some(x=>x.name==='龍紋機關師·林大師') && G.activatedCombos.has('master_lin')){
          trap.atk=3; trap.maxHp=2; trap.hp=2;
          const lin=owner.board.find(x=>x.name==='龍紋機關師·林大師');
          if(lin){ lin.hp=Math.min(lin.hp+2,lin.maxHp); }
          log(`🐾 傳承之火！愛犬記憶晶片超載激活，機關陷阱強化為3/2，林大師回復2點生命！`,tag);
        } else {
          log(`⚙ ${c.name} 報廢效果：召喚一個1/1機關陷阱！`,tag);
        }
      }
      break;
    case 'dmg3rand':
      if(enemy&&enemy.board.length){
        const t=enemy.board[Math.floor(Math.random()*enemy.board.length)];
        log(`💥 ${c.name} 報廢效果：對 ${t.name} 造成 2 點傷害！`,tag);
        t.hp-=2;
        if(t.hp<=0){ log(`💀 ${t.name} 報廢了！`,"death"); killCard(t,enemy,owner); }
      } else { log(`💥 ${c.name} 報廢效果：沒有敵方手下目標！`,"sys"); }
      break;
    case 'draw2':
      drawCard(owner,true); drawCard(owner,true);
      log(`📥 ${c.name} 報廢效果：抽了兩張牌！`,tag);
      break;
    case 'dr_draw1':
      drawCard(owner,true);
      log(`📥 ${c.name} 報廢效果：抽了一張牌！`,tag);
      break;
    default: break;
  }
}

// enemy = opposing side; owner = who played the card
function doBattlecry(c, enemy, owner) {
  const tag = owner===G.player?"player":"ai";
  switch(c.bcType) {
    case 'draw1':
      drawCard(owner,true);
      log(`🃏 ${c.name} 部署效果：抽了一張牌！`,tag);
      break;
    case 'fuel1':
      owner.fuel++;
      log(`⚡ ${c.name} 部署效果：獲得 1 點額外燃料！（共 ${owner.fuel} 點）`,tag);
      break;
    case 'dmg2rand': {
      if(!enemy.board.length){ log(`🔫 ${c.name} 部署效果：沒有目標！`,"sys"); break; }
      const t=enemy.board[Math.floor(Math.random()*enemy.board.length)];
      log(`🔫 ${c.name} 部署效果：對 ${t.name} 造成 2 點傷害！`,tag);
      t.hp-=2;
      if(t.hp<=0){ log(`💀 ${t.name} 報廢了！`,"death"); killCard(t,enemy,owner); }
      // Combo 2: 發條孿生星 — 卡斯托爾的預言之彈重複觸發一次
      if(c.name==='發條先知·卡斯托爾' && owner.board.some(x=>x.name==='發條先知·波魯克斯') && G.activatedCombos.has('twin_stars')){
        if(enemy.board.length){
          const t2=enemy.board[Math.floor(Math.random()*enemy.board.length)];
          log(`🌟 預言成真！卡斯托爾的預言之彈再度降臨 ${t2.name}！`,tag);
          t2.hp-=2;
          if(t2.hp<=0){ log(`💀 ${t2.name} 報廢了！`,"death"); killCard(t2,enemy,owner); }
        }
      }
      break;
    }
    case 'healfriendly': {
      const wounded=owner.board.filter(x=>x.hp<x.maxHp && x.id!==c.id);
      if(!wounded.length){ log(`💚 ${c.name} 部署效果：戰場上沒有其他受傷的友方手下，維修光束空發了。`,"sys"); break; }
      const t=wounded[Math.floor(Math.random()*wounded.length)];
      const prev=t.hp; t.hp=t.maxHp;
      log(`💚 ${c.name} 部署效果：${t.name} 回復了 ${t.hp-prev} 點生命值，防線修復完畢！`,tag);
      break;
    }
    case 'destroyall': {
      if(!enemy.board.length){ log(`💣 ${c.name} 部署效果：沒有敵方手下！`,"sys"); break; }
      const killed=[...enemy.board];
      enemy.board=[];
      log(`💣 ${c.name} 部署效果：摧毀所有敵方手下！（共${killed.length}個）`,tag);
      for(const t of killed){ log(`💀 ${t.name} 報廢了！`,"death"); killCard(t,enemy,owner); }
      break;
    }
    case 'dmg1all': {
      if(!enemy.board.length){ log(`💣 ${c.name} 部署效果：沒有敵方手下！`,"sys"); break; }
      const tgts1=[...enemy.board]; let hits=0;
      for(const t of tgts1){ t.hp-=1; hits++; if(t.hp<=0){ log(`💀 ${t.name} 報廢了！`,"death"); killCard(t,enemy,owner); } }
      log(`💣 ${c.name} 部署效果：對所有敵方手下各造成1傷害！（${hits}個目標）`,tag);
      break;
    }
    case 'destroyhigh': {
      const tgts=enemy.board.filter(t=>t.atk>=5);
      if(!tgts.length){ log(`🔧 ${c.name} 部署效果：沒有攻擊≥5的目標`,"sys"); break; }
      const t=tgts.reduce((m,x)=>x.atk>m.atk?x:m,tgts[0]);
      log(`🔧 ${c.name} 部署效果：摧毀了 ${t.name}！`,tag);
      killCard(t,enemy,owner);
      break;
    }
    default: break;
  }
}

function handleEndOfTurnEffects(who) {
  for(const c of [...who.board]) {
    if(!c.endOfTurn) continue;
    const tag = who===G.player?"player":"ai";
    switch(c.eotType) {
      case 'savefuel':
        if(who.fuel>0){
          if(who===G.player){
            G.savedFuel=Math.min(who.fuel,3);
            log(`⏰ ${c.name} 儲存了 ${G.savedFuel} 燃料至下回合！`,tag);
          } else {
            G.aiSavedFuel=Math.min(who.fuel,3);
            log(`⏰ AI的 ${c.name} 儲存了 ${G.aiSavedFuel} 燃料至下回合！`,tag);
          }
        }
        break;
      case 'heal2self':
        if(c.hp<c.maxHp){
          const heal=Math.min(2,c.maxHp-c.hp);
          c.hp+=heal;
          log(`🔩 ${c.name} 回合結束：自我回復 ${heal} 點生命！`,tag);
        }
        break;
      case 'eot_draw1':
        drawCard(who,true);
        log(`📥 ${c.name} 回合結束：抽了一張牌！`,tag);
        // Combo 4: 天穹情報封鎖線 — 2+ 天穹在場時每次抽牌 +1 天穹防線
        if(G.activatedCombos.has('sky_defense') && who.board.filter(x=>x.tribe==='天穹').length>=2){
          who.board.filter(x=>x.tribe==='天穹').forEach(x=>{ x.maxHp+=1; x.hp+=1; });
          log(`📡 天穹情報封鎖線：知識之牆加固，所有天穹手下生命上限 +1！`,tag);
        }
        break;
      default: break;
    }
  }
}

// ═══════════════════════════════════════
//  ATTACK ANIMATION
// ═══════════════════════════════════════
let G_animating = false;

function animateAttack(atkCardId, tgtEl, onDone) {
  if (!tgtEl) { onDone(); return; }
  const atkEl = document.querySelector(`[data-card-id="${atkCardId}"]`);
  if (!atkEl) { onDone(); return; }

  G_animating = true;

  const atkR = atkEl.getBoundingClientRect();
  const tgtR = tgtEl.getBoundingClientRect();

  // ── 建立飛行克隆牌 ──
  const clone = document.createElement('div');
  clone.className = 'atk-clone';
  clone.innerHTML = atkEl.innerHTML;
  Object.assign(clone.style, {
    left: atkR.left + 'px',
    top:  atkR.top  + 'px',
    width:  atkR.width  + 'px',
    height: atkR.height + 'px',
    background: '#1e1006',
    transform: 'scale(1)',
    transition: 'none',
    opacity: '1',
  });
  document.body.appendChild(clone);

  const atkCX = atkR.left + atkR.width  / 2;
  const atkCY = atkR.top  + atkR.height / 2;
  const tgtCX = tgtR.left + tgtR.width  / 2;
  const tgtCY = tgtR.top  + tgtR.height / 2;
  const dx = tgtCX - atkCX;
  const dy = tgtCY - atkCY;

  // ── 第一段：懸浮升起 (130ms) ──
  requestAnimationFrame(() => {
    clone.style.transition = 'transform .13s ease-out, box-shadow .13s';
    clone.style.transform  = 'translateY(-14px) scale(1.12)';
    clone.style.boxShadow  = '0 0 0 3px #ffe060,0 10px 30px rgba(255,210,50,.7)';

    setTimeout(() => {
      // ── 第二段：衝向目標 (240ms) ──
      clone.style.transition = 'transform .24s cubic-bezier(.4,0,.8,.6)';
      clone.style.transform  = `translate(${dx}px,${dy - 14}px) scale(.88)`;

      setTimeout(() => {
        // ── 撞擊效果 ──
        // 震動目標
        tgtEl.classList.add('impact-shake');
        const prevFilter = tgtEl.style.filter || '';
        tgtEl.style.filter = 'brightness(3) saturate(.2)';
        setTimeout(() => {
          tgtEl.style.filter = prevFilter;
          setTimeout(() => tgtEl.classList.remove('impact-shake'), 300);
        }, 75);

        // 撞擊光環
        const ring = document.createElement('div');
        ring.className = 'impact-ring';
        Object.assign(ring.style, {
          left: (tgtCX - 28) + 'px',
          top:  (tgtCY - 28) + 'px',
        });
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 380);

        // ── 第三段：彈回原位 (200ms) ──
        clone.style.transition = 'transform .20s cubic-bezier(.34,1.4,.64,1), opacity .15s';
        clone.style.transform  = 'translateY(0) scale(1)';

        setTimeout(() => {
          clone.style.transition = 'opacity .1s';
          clone.style.opacity = '0';
          setTimeout(() => {
            clone.remove();
            G_animating = false;
            onDone();
          }, 110);
        }, 210);
      }, 250);
    }, 140);
  });
}

function selectHandCard(i) {
  if(G.phase!=='player'||G.gameOver||G_animating)return;
  G.selBoard=-1;
  G.selHand = G.selHand===i ? -1 : i;
  render();
}

function deployCard() {
  if(G.phase!=='player'||G.selHand<0||G.gameOver)return;
  if(G.player.board.length>=7){ log("❌ 戰場已滿！最多7個手下","sys"); return; }
  const c=G.player.hand[G.selHand];
  if(!c)return;
  if(G.player.fuel<c.cost){ log(`❌ 燃料不足！需要 ${c.cost} 點`,"sys"); return; }
  G.player.fuel-=c.cost; G.player.hand.splice(G.selHand,1);
  c.isSick=true; c.hasAttacked=false; G.player.board.push(c);
  G.selHand=-1; log(`⚙️ 成功部署 ${c.name}！`,"player");
  if(c.battlecry){ doBattlecry(c,G.ai,G.player); }
  checkTribeSynergy(c, G.player);
  checkCombos(G.player); checkCombos(G.ai);
  render(); checkWin();
}

function selectAttacker(i) {
  if(G.phase!=='player'||G.gameOver||G_animating)return;
  G.selHand=-1;
  const c=G.player.board[i];
  if(!c)return;
  if(c.isSick){ log("❌ 剛上場的手下本回合無法攻擊！","sys"); return; }
  if(c.hasAttacked){ log("❌ 本回合已攻擊過了！","sys"); return; }
  if(c.atk<=0){ log("❌ 攻擊力為 0 的手下無法攻擊！","sys"); return; }
  G.selBoard = G.selBoard===i ? -1 : i;
  render();
}

function attackMinion(i) {
  if(G.phase!=='player'||G.selBoard<0||G.gameOver||G_animating)return;
  const atk=G.player.board[G.selBoard];
  if(!atk)return;
  if(!canAttack(atk)){ G.selBoard=-1; render(); return; }
  const taunts=G.ai.board.filter(c=>c.taunt);
  const def=G.ai.board[i];
  if(!def)return;
  if(taunts.length&&!def.taunt){ log("❌ 對手有攔截（嘓諷）手下，必須先攻擊！","sys"); return; }

  const tgtEl  = document.querySelector(`#ai-board [data-card-id="${def.id}"]`);
  const atkId  = atk.id;
  const savedSB = G.selBoard;
  G.selBoard = -1; // 取消選中高亮，但先不 re-render

  animateAttack(atkId, tgtEl, () => {
    const atk2 = G.player.board.find(c=>c.id===atkId);
    if(atk2 && def) combat(atk2, G.player, def, G.ai);
    G.selBoard=-1; render(); checkWin();
  });
}

function attackFace() {
  if(G.phase!=='player'||G.selBoard<0||G.gameOver||G_animating)return;
  const atk=G.player.board[G.selBoard];
  if(!atk)return;
  if(!canAttack(atk)){ G.selBoard=-1; render(); return; }
  const taunts=G.ai.board.filter(c=>c.taunt);
  if(taunts.length){ log("❌ 對手有攔截（嘓諷）手下，必須先攻擊！","sys"); return; }

  // 優先飛向場上的英雄按鈕；其次飛向上方資訊列的 HP 圖示
  const tgtEl = document.querySelector('#ai-board .hero-btn.valid-target')
             || document.getElementById('ai-hero-hp');
  const atkId  = atk.id;
  G.selBoard = -1;

  animateAttack(atkId, tgtEl, () => {
    const atk2 = G.player.board.find(c=>c.id===atkId);
    if(atk2){
      G.ai.hp -= atk2.atk; atk2.hasAttacked=true;
      log(`💥 你的 ${atk2.name} 直接攻擊AI英雄！-${atk2.atk}`,"player");
      showFloat(atk2.atk,'ai-hero-hp');
    }
    G.selBoard=-1; render(); checkWin();
  });
}

function surrender() {
  if(G.gameOver)return;
  if(confirm('確認投降？')){ G.player.hp=0; checkWin(); }
}

// ═══════════════════════════════════════
//  WIN CHECK
// ═══════════════════════════════════════
function checkWin() {
  if(G.gameOver)return false;
  if(G.player.hp<=0||G.ai.hp<=0){
    G.gameOver=true; G.aiThinking=false;
    hideCardPreview();
    const win=G.ai.hp<=0;
    document.getElementById("go-title").textContent = win?"🏆 勝利！":"💀 落敗";
    document.getElementById("go-sub").textContent   = win
      ?"恭喜！你用精湛的鋼鐵智慧擊敗了自動化AI！你的工坊屹立不搖！"
      :"你的工坊核心過熱爆炸了… 但工程師永不言棄，再戰一局！";
    document.getElementById("game-over").classList.add("show");
    render(); return true;
  }
  return false;
}

function restartGame() {
  document.getElementById("game-over").classList.remove("show");
  initGame();
}

  const el=document.createElement("div"); el.className="dmg-float"; el.textContent="-"+n;
  const a=document.getElementById(anchorId);
  if(a){ const r=a.getBoundingClientRect(); el.style.left=(r.left+r.width/2-14)+"px"; el.style.top=(r.top+r.height/2-14)+"px"; }
  else { el.style.left="50%"; el.style.top="40%"; }
  document.body.appendChild(el); setTimeout(()=>el.remove(),950);
}

function portraitSvg(card, s) {
  const cols = PORTRAIT_COLORS[card.portrait]||['#222','#111'];
  const icon = (PORTRAIT_SVG[card.portrait]||((x)=>''))(s);
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="pg${card.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${cols[0]}"/><stop offset="100%" stop-color="${cols[1]}"/>
    </linearGradient></defs>
    <rect width="${s}" height="${s}" fill="url(#pg${card.id})"/>${icon}</svg>`;
}

function portraitArt(card, s) {
  const art = CARD_ART[card.name];
  if(!art) return portraitSvg(card, s);
  return `<img class="portrait-img" src="${art}" alt="${card.name}">`;
}

// ── Fly-to-graveyard animation ──────────────────────────────────────────────
function animateFlyToGrave(fromRect, targetId) {
  const tgtEl = document.getElementById(targetId);
  if(!tgtEl || !fromRect) return;
  const tgtRect = tgtEl.getBoundingClientRect();
  const w = Math.min(fromRect.width, 80), h = Math.min(fromRect.height, 108);
  const fly = document.createElement('div');
  fly.className = 'fly-to-grave';
  fly.style.cssText = [
    `top:${fromRect.top}px`, `left:${fromRect.left + (fromRect.width-w)/2}px`,
    `width:${w}px`, `height:${h}px`, `opacity:.85`,
    `transition:top .52s cubic-bezier(.4,0,.6,1),left .52s cubic-bezier(.4,0,.6,1),` +
      `width .52s,height .52s,opacity .44s ease-in,transform .52s ease-in`
  ].join(';');
  document.body.appendChild(fly);
  const cx = tgtRect.left + tgtRect.width/2 - 12;
  const cy = tgtRect.top  + tgtRect.height/2 - 12;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fly.style.top=`${cy}px`; fly.style.left=`${cx}px`;
    fly.style.width='24px';  fly.style.height='24px';
    fly.style.opacity='0';   fly.style.transform='rotate(22deg)';
    setTimeout(()=>fly.remove(), 570);
  }));
}

// ── Graveyard modal ──────────────────────────────────────────────────────────
function showGraveyard(side) {
  const who = side==='player' ? G.player : G.ai;
  const label = side==='player' ? '林工程師' : '自動化AI';
  document.getElementById('grave-title-txt').textContent =
    `⚰ ${label} · 報廢牌堆（${who.graveyard.length}）`;
  const list = document.getElementById('grave-card-list');
  if(!who.graveyard.length){
    list.innerHTML=`<div class="grave-empty-txt">牌堆為空</div>`;
  } else {
    list.innerHTML = who.graveyard.map(c=>`
      <div class="grave-card${c.reason==='burned'?' burned':''}">
        <div class="grave-portrait">${portraitArt(c,56)}</div>
        <div class="grave-card-name">${c.name}</div>
        <div class="grave-card-stats">${c.atk}⚔ ${c.maxHp}♥</div>
        <div class="grave-card-reason">${c.reason==='burned'?'🔥 燒毀':'💀 陣亡'}</div>
      </div>`).join('');
  }
  const modal=document.getElementById('graveyard-modal');
  modal.setAttribute('aria-hidden','false'); modal.classList.add('show');
}
function closeGraveyard() {
  const modal=document.getElementById('graveyard-modal');
  modal.classList.remove('show'); modal.setAttribute('aria-hidden','true');
}

function renderFuel(cur, max) {
  return Array.from({length:10},(_,i)=>`<div class="fuel-crystal${i<cur?' active':''}"></div>`).join('')
    + `<span class="fuel-label">${cur}/${max}</span>`;
}

function canAttack(c) {
  return c && c.atk>0 && !c.hasAttacked && !c.isSick;
}

function renderCardZoom(c) {
  const wound = c.hp<c.maxHp;
  return `<div class="card-zoom">
    <div class="zoom-mana">${c.cost}</div>
    <div class="zoom-portrait">${portraitArt(c,235)}</div>
    <div class="zoom-name">${c.name}</div>
    <div class="zoom-text">${c.text||'&nbsp;'}</div>
    <div class="zoom-stats">
      <div class="stat-gem gem-atk">${c.atk}</div>
      <div class="stat-gem gem-hp${wound?' wounded':''}">${c.hp}</div>
    </div>
  </div>`;
}

let cardPreviewTimer = null;

function showCardPreview(c) {
  if(!c) return;
  const preview = document.getElementById("card-preview");
  preview.innerHTML = renderCardZoom(c);
  preview.classList.add("show");
}

function scheduleCardPreview(c) {
  clearTimeout(cardPreviewTimer);
  hideCardPreview();
  cardPreviewTimer = setTimeout(()=>showCardPreview(c), 350);
}

function showHandCardPreview(idx) {
  scheduleCardPreview(G.player.hand[idx]);
}

function showBoardCardPreview(side, idx) {
  scheduleCardPreview((side==="player"?G.player:G.ai).board[idx]);
}

function showMulliganCardPreview(cardId) {
  const c = G.player.hand.find(x=>x.id===cardId);
  if(c) scheduleCardPreview(c);
}

function hideCardPreview() {
  clearTimeout(cardPreviewTimer);
  cardPreviewTimer = null;
  const preview = document.getElementById("card-preview");
  preview.classList.remove("show");
}

function renderMinion(c, isPlayer, idx) {
  const selAtk  = isPlayer && idx===G.selBoard;
  const canAtk  = isPlayer && canAttack(c) && G.phase==='player';
  const hasTauntAI = !isPlayer && G.ai.board.some(x=>x.taunt);
  const validTgt = !isPlayer && G.selBoard>=0 && G.phase==='player' && (!hasTauntAI||c.taunt);
  const exh      = isPlayer && (c.hasAttacked||c.isSick);
  let cls="minion-card";
  if(selAtk) cls+=" selected-attacker";
  if(canAtk&&!selAtk) cls+=" can-attack";
  if(validTgt) cls+=" valid-target";
  if(exh) cls+=" exhausted";
  const onclick = isPlayer ? `onclick="selectAttacker(${idx})"` : `onclick="attackMinion(${idx})"`;
  const wound = c.hp<c.maxHp;
  const hover = isPlayer
    ? `onmouseenter="showBoardCardPreview('player',${idx})"`
    : `onmouseenter="showBoardCardPreview('ai',${idx})"`;
  return `<div class="${cls}" data-card-id="${c.id}" ${onclick} ${hover} onmouseleave="hideCardPreview()">
    ${c.taunt?'<div class="taunt-ring"></div>':''}
    ${c.tribe?`<div class="tribe-badge">${c.tribe}</div>`:''}
    <div class="card-portrait-mini">${portraitArt(c,54)}</div>
    <div class="card-name-mini">${c.name}</div>
    ${c.text?`<div class="card-text-mini">${c.text}</div>`:''}
    <div class="card-stats">
      <div class="stat-gem gem-atk">${c.atk}</div>
      <div class="stat-gem gem-hp${wound?' wounded':''}">${c.hp}</div>
    </div>
  </div>`;
}

function renderHandCard(c, idx) {
  const sel     = idx===G.selHand;
  const afford  = G.player.fuel>=c.cost;
  let cls="hand-card";
  if(sel) cls+=" selected-hand";
  if(!afford) cls+=" cant-afford";
  return `<div class="${cls}" onclick="selectHandCard(${idx})" onmouseenter="showHandCardPreview(${idx})" onmouseleave="hideCardPreview()">
    <div class="mana-gem">${c.cost}</div>
    ${c.tribe?`<div class="tribe-badge" style="top:2px;right:2px;">${c.tribe}</div>`:''}
    <div class="hand-portrait">${portraitArt(c,48)}</div>
    <div class="hand-name">${c.name}</div>
    <div class="hand-text">${c.text||'&nbsp;'}</div>
    <div class="hand-stats">
      <div class="stat-gem gem-atk">${c.atk}</div>
      <div class="stat-gem gem-hp">${c.hp}</div>
    </div>
  </div>`;
}

function render() {
  renderMusicToggle();
  const ip=G.phase==='player'&&!G.gameOver;
  const hasTauntAI = G.ai.board.some(c=>c.taunt);
  const hasTauntPl = G.player.board.some(c=>c.taunt);
  const canHeroAtk = G.selBoard>=0 && ip && !hasTauntAI;

  // ── AI Info ──
  document.getElementById("ai-info").innerHTML=`
    <div class="hp-orb">
      <div class="hp-icon${canHeroAtk?' valid-target':''}" id="ai-hero-hp" onclick="attackFace()">${G.ai.hp}</div>
      <span>自動化AI</span>
    </div>
    <div style="display:flex;gap:2px;align-items:center;">
      ${Array.from({length:G.ai.hand.length},()=>'<div class="ai-hand-card"></div>').join('')}
    </div>
    <span class="info-extra">燃料 ${G.ai.fuel}/${G.ai.maxFuel} ｜ 牌組 ${G.ai.deck.length}</span>
    <span class="hand-count${G.ai.hand.length>=10?' full':G.ai.hand.length>=7?' near-full':''}">手牌 ${G.ai.hand.length}/10</span>
    ${hasTauntAI?'<span style="font-size:9px;color:#88bb30;margin-left:4px;">⚠攔截</span>':''}
    <button class="graveyard-btn${G.ai.graveyard.length?' has-cards':''}" id="ai-grave-btn" onclick="showGraveyard('ai')">⚰ ${G.ai.graveyard.length}</button>
  `;

  // ── AI Board ──
  const aiBoardEl=document.getElementById("ai-board");
  if(!G.ai.board.length){
    aiBoardEl.innerHTML=canHeroAtk
      ?`<div class="hero-btn valid-target" onclick="attackFace()">⚙<div class="hp-badge">${G.ai.hp}</div></div>`
      :`<span class="board-empty">[ 空場 ]</span>`;
  } else {
    let heroHtml='';
    if(canHeroAtk) heroHtml=`<div class="hero-btn valid-target" onclick="attackFace()">⚙<div class="hp-badge">${G.ai.hp}</div></div>`;
    aiBoardEl.innerHTML=heroHtml+G.ai.board.map((c,i)=>renderMinion(c,false,i)).join('');
  }

  // ── Player Board ──
  const plBoardEl=document.getElementById("player-board");
  plBoardEl.innerHTML=G.player.board.length
    ? G.player.board.map((c,i)=>renderMinion(c,true,i)).join('')
    : `<span class="board-empty">[ 空場 ]</span>`;

  // ── Controls ──
  const sc=G.selHand>=0?G.player.hand[G.selHand]:null;
  const canDeploy=sc&&G.player.fuel>=sc.cost&&G.player.board.length<7;
  const hint = !ip?'AI 思考中…':
    G.selBoard>=0?'⚔ 選擇攻擊目標（敵方手下或英雄）':
    G.selHand>=0?'點選【部署】出牌，或選擇友方手下攻擊':
    '選取手牌出牌，或點選己方手下攻擊';
  document.getElementById("player-controls").innerHTML=`
    <button class="btn primary" onclick="deployCard()" ${!ip||!canDeploy?'disabled':''}>
      ⚙ 部署${sc?` (${sc.cost}燃料)`:''}
    </button>
    <button class="btn" onclick="endPlayerTurn()" ${!ip?'disabled':''}>結束回合</button>
    <button class="btn danger" onclick="surrender()" ${!ip?'disabled':''}>投降</button>
    <span class="phase-hint">${hint}</span>
  `;

  // ── Player Info ──
  document.getElementById("player-info").innerHTML=`
    <div class="hp-orb">
      <div class="hp-icon" id="player-hero-hp">${G.player.hp}</div>
      <span>林工程師</span>
    </div>
    <div class="fuel-bar">${renderFuel(G.player.fuel,G.player.maxFuel)}</div>
    <span id="player-deck-lbl" class="info-extra">牌組 ${G.player.deck.length}</span>
    <span class="hand-count${G.player.hand.length>=10?' full':G.player.hand.length>=7?' near-full':''}">手牌 ${G.player.hand.length}/10</span>
    ${hasTauntPl?'<span style="font-size:9px;color:#88bb30;margin-left:4px;">⚠攔截</span>':''}
    <button class="graveyard-btn${G.player.graveyard.length?' has-cards':''}" id="player-grave-btn" onclick="showGraveyard('player')">⚰ ${G.player.graveyard.length}</button>
  `;

  // ── Hand ──
  document.getElementById("player-hand").innerHTML=G.player.hand.length
    ? G.player.hand.map((c,i)=>renderHandCard(c,i)).join('')
    : `<span style="color:rgba(200,170,110,.25);font-size:11px;font-style:italic;">無手牌</span>`;

  // ── AI thinking ──
  document.getElementById("ai-thinking").style.display=G.aiThinking?'block':'none';

  // ── Log ──
  const typeMap={player:'log-player',ai:'log-ai',sys:'log-sys',dmg:'log-dmg',death:'log-death'};
  document.getElementById("game-log").innerHTML=
    G.log.map(l=>`<div class="log-entry ${typeMap[l.type]||'log-sys'}">${l.msg}</div>`).join('');

  // ── Banner ──
  document.getElementById("turn-banner").textContent=
    ip?`第 ${G.turn} 回合 · 你的回合`:`第 ${G.turn} 回合 · AI 回合`;
}

initGame();
</script>
</body>
</html>
